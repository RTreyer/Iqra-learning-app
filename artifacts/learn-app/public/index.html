<!doctype html>
<html lang="ar">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#E8DDBE" />
    <title>أَقْرَأُ وَأَتَعَلَّمُ</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        margin: 0;
        background: #e8ddbe;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!--
      The loading screen. It is plain HTML inside #root, so it shows the moment the page
      arrives, long before the app's scripts have downloaded on a slow line. React replaces
      it when the app first renders. Styles only: the CSP allows no inline scripts.
    -->
    <style id="iqra-boot">
      .boot {
        flex: 1;
        display: flex;
        justify-content: center;
      }
      .boot-app {
        flex: 1;
        max-width: 480px;
        background: #fffbf0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif;
        color: #1e293b;
      }
      .boot-icon {
        width: 112px;
        height: 112px;
        border-radius: 28px;
      }
      .boot-title {
        margin: 0;
        font-size: 30px;
        font-weight: 800;
      }
      .boot-bar {
        width: 160px;
        height: 10px;
        border-radius: 5px;
        background: #efe3c8;
        overflow: hidden;
      }
      .boot-bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 5px;
        background: #b5522e;
        animation: boot-slide 1.4s ease-in-out infinite;
      }
      .boot-text {
        margin: 0;
        font-size: 18px;
        color: #64748b;
      }
      @keyframes boot-slide {
        from {
          transform: translateX(110%);
        }
        to {
          transform: translateX(-260%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar span {
          animation: none;
          width: 100%;
          opacity: 0.6;
        }
      }
    </style>
  </head>

  <body>
    <noscript>يحتاج التطبيق إلى JavaScript. You need to enable JavaScript to run this app.</noscript>
    <!-- The root element for your Expo app. -->
    <div id="root">
      <div class="boot" id="boot" role="status" dir="rtl">
        <div class="boot-app">
          <img class="boot-icon" src="/icons/icon-192.png" width="112" height="112" alt="" />
          <p class="boot-title">أَقْرَأُ وَأَتَعَلَّمُ</p>
          <div class="boot-bar" aria-hidden="true"><span></span></div>
          <p class="boot-text">جَارٍ التَّحْمِيلُ…</p>
        </div>
      </div>
    </div>
  </body>
</html>
