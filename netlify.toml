# Netlify: build the Expo app as a static website.
[build]
  # The repo installs with node-linker=hoisted (.npmrc). Netlify's dependency
  # cache can still hold a package-level node_modules from the older isolated
  # layout, whose .bin/expo shim points at a path that no longer exists. Drop
  # it and reinstall so the build always uses the hoisted expo CLI.
  command = "rm -rf artifacts/learn-app/node_modules && pnpm install --frozen-lockfile && pnpm --filter @workspace/learn-app run build"
  publish = "artifacts/learn-app/dist"

[build.environment]
  NODE_VERSION = "24"

# The app is a single-page app: every path (e.g. /lesson/u2-3) is served by
# index.html and resolved by expo-router in the browser.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
