# Builds the web app and pushes it to the test-build-dist branch, for testing the exact build
# outside Netlify (e.g. automated test agents). Runs only on this branch or by hand.
name: Test build

on:
  push:
    branches: [ci/test-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/learn-app run build
      # Artifact downloads go through blob storage; a branch can be fetched with plain git.
      - name: Push the build to the test-build-dist branch
        run: |
          cd artifacts/learn-app/dist
          git init -q -b test-build-dist
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Web build of ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" test-build-dist
