# Builds the web app and keeps it as a downloadable artifact, for testing the exact build
# outside Netlify (e.g. automated test agents). Runs only on this branch or by hand.
name: Test build

on:
  push:
    branches: [ci/test-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/learn-app run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: artifacts/learn-app/dist
          retention-days: 7
